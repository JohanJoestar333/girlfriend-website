name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject Firebase, Cloudinary and other config from repository secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          METERED_TURN_DOMAIN: ${{ secrets.METERED_TURN_DOMAIN }}
          METERED_TURN_API_KEY: ${{ secrets.METERED_TURN_API_KEY }}

        run: |
          # Inject Firebase / Cloudinary / TMDB / Metered config into app.js
          sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" app.js
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${FIREBASE_AUTH_DOMAIN}|g" app.js
          sed -i "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g" app.js
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${FIREBASE_STORAGE_BUCKET}|g" app.js
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" app.js
          sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g" app.js
          sed -i "s|__CLOUDINARY_CLOUD_NAME__|${CLOUDINARY_CLOUD_NAME}|g" app.js
          sed -i "s|__CLOUDINARY_UPLOAD_PRESET__|${CLOUDINARY_UPLOAD_PRESET}|g" app.js
          sed -i "s|__TMDB_ACCESS_TOKEN__|${TMDB_ACCESS_TOKEN}|g" app.js
          sed -i "s|__METERED_TURN_DOMAIN__|${METERED_TURN_DOMAIN}|g" app.js
          sed -i "s|__METERED_TURN_API_KEY__|${METERED_TURN_API_KEY}|g" app.js

          # Also inject into index.html in case any leftover placeholders remain
          sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" index.html
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${FIREBASE_AUTH_DOMAIN}|g" index.html
          sed -i "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g" index.html
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${FIREBASE_STORAGE_BUCKET}|g" index.html
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" index.html
          sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g" index.html
          sed -i "s|__CLOUDINARY_CLOUD_NAME__|${CLOUDINARY_CLOUD_NAME}|g" index.html
          sed -i "s|__CLOUDINARY_UPLOAD_PRESET__|${CLOUDINARY_UPLOAD_PRESET}|g" index.html
          sed -i "s|__TMDB_ACCESS_TOKEN__|${TMDB_ACCESS_TOKEN}|g" index.html
          sed -i "s|__METERED_TURN_DOMAIN__|${METERED_TURN_DOMAIN}|g" index.html
          sed -i "s|__METERED_TURN_API_KEY__|${METERED_TURN_API_KEY}|g" index.html

          # Make sure all required configuration placeholders were replaced
          if grep -q "__FIREBASE_API_KEY__\|__FIREBASE_AUTH_DOMAIN__\|__FIREBASE_PROJECT_ID__\|__CLOUDINARY_CLOUD_NAME__\|__TMDB_ACCESS_TOKEN__\|__METERED_TURN_DOMAIN__\|__METERED_TURN_API_KEY__" app.js; then
            echo "ERROR: One or more configuration placeholders remain in app.js"
            echo "Check that the corresponding GitHub Actions secrets exist."
            exit 1
          fi

          echo "SUCCESS: Application configuration injected."

      - name: Inject password hash into gate.js
        env:
          GATE_PASSWORD: ${{ secrets.GATE_PASSWORD }}
        run: |
          # Make sure the password secret exists
          if [ -z "$GATE_PASSWORD" ]; then
            echo "ERROR: GATE_PASSWORD GitHub Actions secret is missing."
            echo "Go to Settings -> Secrets and variables -> Actions and add GATE_PASSWORD."
            exit 1
          fi

          # Generate SHA-256 hash without printing the password
          GATE_PASSWORD_HASH=$(printf '%s' "$GATE_PASSWORD" | sha256sum | cut -d ' ' -f 1)

          # Inject only the hash into gate.js
          sed -i "s|__GATE_PASSWORD_HASH__|${GATE_PASSWORD_HASH}|g" gate.js

          # Make sure the placeholder was replaced
          if grep -q "__GATE_PASSWORD_HASH__" gate.js; then
            echo "ERROR: Password hash placeholder was not replaced in gate.js"
            exit 1
          fi

          # Safety check: the plaintext password must NOT appear in gate.js
          if grep -Fq "$GATE_PASSWORD" gate.js; then
            echo "ERROR: Plaintext password was found in gate.js"
            exit 1
          fi

          echo "SUCCESS: Password protection configured."

      - name: Verify password gate
        run: |
          if [ ! -f gate.js ]; then
            echo "ERROR: gate.js was not found."
            exit 1
          fi

          if ! grep -q "GATE_PASSWORD_HASH\|__GATE_PASSWORD_HASH__\|password" gate.js; then
            echo "WARNING: Could not find expected password-gate code in gate.js."
          fi

          echo "SUCCESS: gate.js exists and is ready for deployment."

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
